<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="WOOD CARVERS — Handcrafted wooden decorative pieces made to bring character to your space. Small to medium statues, wall hangings, frames, and artisanal gifts.">
  <meta name="keywords" content="wood carving, handcrafted wood, wall hangings, wooden statues, wooden toys, decorative stands, home decor, wood carvers">
  <meta name="theme-color" content="#23140C">

  <!-- OpenGraph Metadata -->
  <meta property="og:title" content="WOOD CARVERS — Handcrafted Wooden Decorative Artifacts">
  <meta property="og:description" content="Handcrafted wooden pieces made to bring character to your space.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <title>WOOD CARVERS — Handcrafted Wooden Decorative Artifacts</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF7F2;
      color: #23140C;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #FAF7F2 0%, #F0E8DC 100%);
    }
    .brand-mark {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      letter-spacing: 0.25em;
      color: #23140C;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .brand-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: #8B5A2B;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }
    .wood-grain-loader {
      width: 48px;
      height: 48px;
      border: 3px solid #E8DEC8;
      border-top: 3px solid #8B5A2B;
      border-right: 3px solid #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="brand-mark">WOOD CARVERS</div>
    <div class="brand-tagline">Artisanal Handcrafted Timber</div>
    <div class="wood-grain-loader"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
